<!--
  Manual test page for the Stackup bid adapter (modules/stackupBidAdapter.ts).

  Usage:
    1. npx gulp build --modules=stackupBidAdapter
    2. npx gulp serve-and-test   (or `npx gulp serve` + open this file through
       that server, e.g. http://localhost:9999/integrationExamples/gpt/stackup_example.html)
    3. Point STACKUP_ENDPOINT below at your local PBS (default already set to
       http://localhost:8000/openrtb2/auction) and make sure PBS is running
       with the `tag` seeded (see sample/stackup/README.md, tag "seed-tag-1").

  The banner ad unit renders through GPT, same pattern as hello_world.html.
  The video ad unit has no player wired up here -- it just dumps the winning
  bid's VAST XML into the page so you can confirm a fill was returned and
  inspect it, without pulling in a full video player dependency.
-->

<html>

<head>
    <script async src="../../build/dev/prebid.js"></script>
    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
    <script>
        var FAILSAFE_TIMEOUT = 3300;
        var PREBID_TIMEOUT = 1000;

        // Point this at your Prebid Server deployment, or leave unset to use
        // the adapter's production default.
        var STACKUP_ENDPOINT = 'http://localhost:8000/openrtb2/auction';

        var adUnits = [{
            code: 'div-gpt-ad-stackup-banner',
            mediaTypes: {
                banner: {
                    sizes: [[300, 250]],
                }
            },
            bids: [{
                bidder: 'stackup',
                params: {
                    tag: 'seed-tag-1'
                }
            }]
        }, {
            code: 'stackup-video',
            mediaTypes: {
                video: {
                    context: 'instream',
                    playerSize: [[640, 480]],
                    mimes: ['video/mp4'],
                    protocols: [2, 3, 5, 6, 7, 8]
                }
            },
            bids: [{
                bidder: 'stackup',
                params: {
                    tag: 'seed-tag-1'
                }
            }]
        }];

        var pbjs = pbjs || {};
        pbjs.que = pbjs.que || [];
    </script>

    <script>
        var googletag = googletag || {};
        googletag.cmd = googletag.cmd || [];
        googletag.cmd.push(function () {
            googletag.pubads().disableInitialLoad();
        });

        pbjs.que.push(function () {
            pbjs.setBidderConfig({
                bidders: ['stackup'],
                config: {
                    stackup: {
                        endpoint: STACKUP_ENDPOINT
                    }
                }
            });

            pbjs.addAdUnits(adUnits);

            pbjs.requestBids({
                bidsBackHandler: onBidsBack,
                timeout: PREBID_TIMEOUT
            });
        });

        function onBidsBack() {
            sendAdserverRequest();
            renderVideoDebug();
        }

        function sendAdserverRequest() {
            if (pbjs.adserverRequestSent) return;
            pbjs.adserverRequestSent = true;
            googletag.cmd.push(function () {
                if (pbjs.libLoaded) {
                    pbjs.que.push(function () {
                        pbjs.setTargetingForGPTAsync(['div-gpt-ad-stackup-banner']);
                        googletag.pubads().refresh();
                    });
                } else {
                    googletag.pubads().refresh();
                }
            });
        }

        function renderVideoDebug() {
            var el = document.getElementById('video-debug');
            var bids = pbjs.getBidResponsesForAdUnitCode('stackup-video').bids || [];
            if (!bids.length) {
                el.textContent = 'No video bid returned.';
                return;
            }
            var bid = bids[0];
            el.textContent =
                'cpm: ' + bid.cpm + ' ' + bid.currency + '\n' +
                'bidder: ' + bid.bidder + '\n' +
                'vastXml:\n' + (bid.vastXml || '(none)');
        }

        setTimeout(function () {
            sendAdserverRequest();
        }, FAILSAFE_TIMEOUT);
    </script>

    <script>
        googletag.cmd.push(function () {
            googletag.defineSlot('/19968336/header-bid-tag-0', [[300, 250]], 'div-gpt-ad-stackup-banner')
                .addService(googletag.pubads());

            googletag.pubads().enableSingleRequest();
            googletag.enableServices();
        });
    </script>
</head>

<body>
    <h2>Stackup Bid Adapter Test Page</h2>

    <h5>Banner (div-gpt-ad-stackup-banner, tag: seed-tag-1)</h5>
    <div id='div-gpt-ad-stackup-banner'>
        <script type='text/javascript'>
            googletag.cmd.push(function () { googletag.display('div-gpt-ad-stackup-banner'); });
        </script>
    </div>

    <h5>Video (stackup-video, tag: seed-tag-1) -- raw bid debug, no player</h5>
    <pre id='video-debug'>Waiting for bids...</pre>
</body>

</html>
